services:
  mariadb:
    image: mariadb:10.5
    container_name: sip_edge_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-sip_edge_root}
      MYSQL_DATABASE: ${DB_NAME:-sip_edge}
      MYSQL_USER: ${DB_USER:-sip_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sip_pass}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sip_edge_backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-sip_edge}
      DB_USER: ${DB_USER:-sip_user}
      DB_PASSWORD: ${DB_PASSWORD:-sip_pass}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-sip_edge_root}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-sip_edge_jwt_secret_key_dev}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-admin}
      DEV_MODE: ${DEV_MODE:-true}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./harness:/app/harness
    working_dir: /app

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: sip_edge_phpmyadmin
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: sip_user
      PMA_PASSWORD: sip_pass
      UPLOAD_LIMIT: 100M
    ports:
      - "8080:80"

volumes:
  mariadb_data: